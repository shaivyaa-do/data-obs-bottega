<ul
  nz-menu
  id="docked-buttons"
  [ngClass]="{'shadow':  !width}"
  [hidden]="!currentComponent || !!width"
  [style.left.px]="leftDockOffset">
  <li
    nz-menu-item
    (click)="openPanel()"
    nz-tooltip="Property Editor">
    <span
      nz-icon
      nzType="form"></span>
  </li>
</ul>

<div
  [hidden]="!currentComponent || !width"
  id="right-container"
  nz-resizable
  [nzMinWidth]="260"
  [nzMaxWidth]="window.innerWidth/2"
  [style.width.px]="width"
  [style.height.px]="height"
  [style.left.px]="leftDockOffset"
  (nzResize)="onResize($event)"
  class="property-sidebar left-docked">
  <div
    class="panel-header-bar"
    *ngIf="width">
    <h4 id="title">Property</h4>
    <ul
      nz-menu
      id="property-buttons">
      <!-- Choosing which settings the form offers happens by ticking them in this very
           panel, so the switch that turns those tick boxes on belongs here rather than in
           a row of file and delete icons across the toolbar. Offered wherever the Form View
           feature is enabled. -->
      <button
        nz-button
        [nzType]="choosing ? 'primary' : 'text'"
        class="choose-fields"
        (click)="toggleChoosing()"
        *ngIf="width && formViewFeatureEnabled"
        nz-tooltip
        nzTooltipPlacement="bottomRight"
        [attr.aria-label]="choosing ? 'Done choosing fields' : 'Choose Form View fields'"
        [nzTooltipTitle]="choosing ? 'Done choosing fields' : 'Choose Form View fields'">
        <span
          nz-icon
          nzType="check-square"></span>
      </button>
      <li
        nz-menu-item
        (click)="closePanel()"
        *ngIf="width"
        title="Close">
        <span
          nz-icon
          nzType="minus"></span>
      </li>
    </ul>
  </div>
  <div
    id="content"
    #contentWrapper>
    <div id="property-editor">
      <ng-container *ngComponentOutlet="currentComponent;inputs: componentInputs"></ng-container>
    </div>
  </div>
  <nz-resize-handles
    *ngIf="width"
    [nzDirections]="['right']"></nz-resize-handles>
</div>
