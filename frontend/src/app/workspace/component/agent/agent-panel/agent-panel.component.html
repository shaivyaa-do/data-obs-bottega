<!-- Docked Button -->
<button
  id="agent-docked-button"
  nz-button
  nzType="primary"
  nzShape="circle"
  nzSize="large"
  (click)="openPanel()"
  *ngIf="!width"
  nz-tooltip
  nzTooltipPlacement="left"
  nzTooltipTitle="AI Agents">
  <span
    nz-icon
    nzType="robot"></span>
</button>

<div
  cdkDrag
  cdkDragBoundary="texera-workspace"
  id="agent-container"
  class="box"
  nz-resizable
  [nzMinWidth]="400"
  [nzMinHeight]="450"
  [nzMaxWidth]="window.innerWidth * 0.9"
  [nzMaxHeight]="window.innerHeight * 0.85"
  [style.width.px]="width"
  [style.height.px]="height"
  (nzResize)="onResize($event)"
  (cdkDragStarted)="handleDragStart()"
  [cdkDragFreeDragPosition]="dragPosition">
  <!-- Minimize Button -->
  <ul
    id="return-button"
    nz-menu
    [ngClass]="{'shadow': !width}"
    *ngIf="width">
    <li
      nz-menu-item
      (click)="openPanel()">
      <span
        nz-icon
        nzType="minus"></span>
    </li>
  </ul>

  <div
    #content
    id="content"
    [hidden]="!width">
    <h4
      id="title"
      cdkDragHandle>
      <span class="title-name">{{ selectedAgent?.name || "AI Agents" }}</span>
      <button
        *ngIf="selectedAgent"
        nz-button
        nzType="text"
        nzSize="small"
        class="agent-tab-close"
        (click)="deleteAgent(selectedAgent.id, $event)"
        nz-tooltip
        nzTooltipTitle="Close agent">
        <i
          nz-icon
          nzType="close"
          nzTheme="outline"></i>
      </button>
    </h4>

    <div
      *ngIf="selectedAgent"
      class="chat-view">
      <texera-agent-chat
        [agentInfo]="selectedAgent"
        [isActive]="activeAgentId === selectedAgent.id"></texera-agent-chat>
      <div class="agent-switcher">
        <nz-select
          class="agent-model-select"
          nzPlaceHolder="Select agent"
          [ngModel]="selectedAgent.id"
          (ngModelChange)="onAgentDropdownChange($event)">
          <nz-option
            *ngFor="let agent of agents"
            [nzValue]="agent.id"
            [nzLabel]="agentDropdownLabel(agent)"></nz-option>
        </nz-select>
      </div>
    </div>

    <!-- Empty State when no agents are configured -->
    <div
      *ngIf="agents.length === 0"
      class="empty-agents-view">
      <div class="empty-content">
        <i
          nz-icon
          nzType="robot"
          nzTheme="outline"
          class="empty-icon"></i>
        <h4>No Agents Configured</h4>
        <p>Configure an agent in the Agents dashboard to chat with your workflow co-pilot.</p>
        <button
          nz-button
          nzType="primary"
          (click)="navigateToAgentsDashboard()">
          <i
            nz-icon
            nzType="setting"
            nzTheme="outline"></i>
          <span>Configure in Agents</span>
        </button>
      </div>
    </div>

    <nz-resize-handles [nzDirections]="['left', 'bottom', 'bottomLeft']"></nz-resize-handles>
  </div>
</div>
