<div
  class="hub-workflow-detail-container"
  [class.is-modal]="!isHub">
  <button
    *ngIf="isHub"
    nz-button
    nzType="text"
    nzSize="large"
    class="go-back-button"
    (click)="goBack()">
    <span
      nz-icon
      nzType="arrow-left"></span>
  </button>

  <div class="container">
    <div class="header-info">
      <div class="detail-title">
        <h1 *ngIf="isHub">{{ workflowName || "Workflow Detail" }}</h1>
        <h2
          *ngIf="!isHub"
          class="modal-workflow-name">
          {{ workflowName }}
        </h2>
      </div>
      <div class="workflow-panel">
        <button
          nz-button
          nzType="text"
          class="stat-chip"
          title="Views"
          (click)="changeViewDisplayStyle()">
          <i
            nz-icon
            nzType="eye"></i>
          <span>{{ formatCount(viewCount) }}</span>
        </button>

        <button
          nz-button
          nzType="text"
          class="stat-chip"
          title="Like"
          [disabled]="!isLogin"
          (click)="toggleLike()">
          <i
            nz-icon
            nzType="like"
            [ngClass]="{liked: isLiked}"></i>
          <span>{{ formatCount(likeCount) }}</span>
        </button>

        <button
          nz-button
          nzType="text"
          class="stat-chip"
          title="Copies">
          <i
            nz-icon
            nzType="user"></i>
          <span>{{ formatCount(cloneCount) }}</span>
        </button>

        <button
          nz-button
          nzType="primary"
          class="clone-button"
          title="Clone"
          *ngIf="isHub"
          [disabled]="!isLogin || !isActivatedUser"
          (click)="cloneWorkflow()">
          Clone
        </button>
      </div>
    </div>

    <dl class="workflow-meta">
      <div>
        <dt>ID</dt>
        <dd>{{ wid }}</dd>
      </div>
      <div *ngIf="isHub">
        <dt>Name</dt>
        <dd>{{ workflowName }}</dd>
      </div>
      <div>
        <dt>Created by</dt>
        <dd>{{ ownerName }}</dd>
      </div>
    </dl>

    <section class="workflow-description">
      <h3>Description</h3>
      <texera-markdown-description
        [description]="workflowDescription"
        [enableViewMore]="true">
      </texera-markdown-description>
    </section>

    <ng-container *ngIf="isHub">
      <h3>Preview</h3>
      <div class="preview-containers">
        <texera-workflow-editor></texera-workflow-editor>
        <texera-mini-map class="box"></texera-mini-map>
      </div>
    </ng-container>
    <ng-template #codeEditor></ng-template>
  </div>
</div>
