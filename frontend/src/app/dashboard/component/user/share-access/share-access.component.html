<div class="share-dialog">
  <div
    class="access-button-group"
    *ngIf="isPublic !== null">
    <button
      type="button"
      class="access-button"
      [class.selected]="!isPublic"
      (click)="verifyUnpublish()"
      [disabled]="!hasWriteAccess">
      <i
        nz-icon
        nzType="lock"
        nzTheme="outline"
        class="button-icon"></i>
      <span class="button-text">
        <span class="button-text-header">Private</span>
        <span class="button-text-desc">Only collaborators can view this {{ type }}</span>
      </span>
    </button>

    <button
      type="button"
      class="access-button"
      [class.selected]="isPublic"
      (click)="verifyPublish()"
      [disabled]="!hasWriteAccess">
      <i
        nz-icon
        nzType="user"
        nzTheme="outline"
        class="button-icon"></i>
      <span class="button-text">
        <span class="button-text-header">Public</span>
        <span class="button-text-desc">Anyone on DO Bottega can find and view this {{ type }}</span>
      </span>
    </button>
  </div>

  <form
    [formGroup]="validateForm"
    (ngSubmit)="grantAccess()">
    <section class="share-section">
      <h4 class="share-section-title">People</h4>
      <div class="email-row">
        <input
          nz-input
          id="email"
          type="text"
          formControlName="email"
          (paste)="onPaste($event)"
          [(ngModel)]="ownerSearchValue"
          (ngModelChange)="onChange($event)"
          [nzAutocomplete]="auto"
          placeholder="Add emails" />
        <nz-autocomplete
          [nzDefaultActiveFirstOption]="false"
          [nzDataSource]="filteredOwners"
          nzBackfill
          #auto></nz-autocomplete>
        <button
          nz-button
          (click)="handleInputConfirm($event)"
          class="add-button"
          title="Add"
          type="button">
          <i
            nz-icon
            nzType="plus"
            nzTheme="outline"></i>
        </button>
      </div>
      <div
        class="email-tags"
        *ngIf="emailTags.length > 0">
        <nz-tag
          *ngFor="let email of emailTags"
          nzMode="closeable"
          (nzOnClose)="removeEmailTag(email)">
          {{ email }}
        </nz-tag>
      </div>
      <div class="share-submit-row">
        <label
          class="access-level-label"
          for="access-level"
          >Access</label
        >
        <select
          id="access-level"
          formControlName="accessLevel">
          <option value="READ">read</option>
          <option value="WRITE">write</option>
        </select>
        <button
          [disabled]="!hasWriteAccess"
          nz-button
          nzType="primary"
          class="share-submit"
          type="submit">
          Share
        </button>
      </div>
    </section>
  </form>

  <section class="share-section people-list">
    <div class="people-header">
      <h4
        class="share-section-title"
        id="current-share-label">
        Who has access
      </h4>
      <button
        (click)="ngOnInit()"
        class="reload-button"
        nz-button
        nzType="text"
        nz-tooltip="Reload all accesses"
        nzSize="small"
        nzTooltipPlacement="bottom"
        type="button">
        <i
          nz-icon
          nzTheme="outline"
          nzType="reload"></i>
      </button>
    </div>
    <ul
      class="current-share"
      id="current-share"
      aria-labelledby="current-share-label">
      <li>
        <nz-tag nzColor="green">OWNER</nz-tag>
        <span>{{ owner }}</span>
      </li>
      <li *ngFor="let entry of accessList">
        <select
          [value]="entry.privilege"
          [disabled]="!hasWriteAccess"
          (change)="changeAccessLevel(entry.email, $any($event.target).value)">
          <option value="READ">READ</option>
          <option value="WRITE">WRITE</option>
        </select>
        <span class="access-identity">{{ entry.email }} ({{ entry.name }})</span>
        <button
          [disabled]="!hasWriteAccess && entry.email !== currentEmail"
          (click)="verifyRevokeAccess(entry.email)"
          nz-button
          nzType="text"
          nz-tooltip="Revoke access"
          nzSize="small"
          nzTooltipPlacement="bottom"
          type="button">
          <i
            nz-icon
            nzTheme="outline"
            nzType="delete"></i>
        </button>
      </li>
    </ul>
  </section>
</div>
