<div class="section-container subsection-grid-container">
  <nz-card class="section-title">
    <h2 class="page-title">Workflows</h2>
    <div class="button-group">
      <div class="toolbar-left">
        <div
          class="view-toggle"
          role="group"
          aria-label="View">
          <button
            class="view-toggle-btn"
            title="List View"
            type="button"
            [class.selected]="viewType === 'list'"
            (click)="setViewType('list')">
            <i
              nz-icon
              nzType="bars"
              nzTheme="outline"></i>
          </button>
          <button
            class="view-toggle-btn"
            title="Card View"
            type="button"
            [class.selected]="viewType === 'card'"
            (click)="setViewType('card')">
            <i
              nz-icon
              nzType="appstore"
              nzTheme="outline"></i>
          </button>
        </div>
        <div class="toolbar-search-filter">
          <input
            class="toolbar-search"
            name="workflow-toolbar-search"
            nz-input
            nzVariant="borderless"
            placeholder="Search"
            [ngModel]="searchKeyword"
            (ngModelChange)="onSearchKeywordChange($event)" />
          <texera-filters
            #filters
            class="toolbar-filters"
            [compact]="true"
            [sortMethod]="sortMethod"
            (sortMethodChange)="sortMethod = $event; search()"></texera-filters>
        </div>
        <nz-space-compact class="utility-button-group">
          <button
            *ngIf="pythonNotebookMigrationEnabled"
            nz-button
            (click)="openAiGenerateModal()"
            title="AI generate a workflow from a Python notebook"
            nz-tooltip="AI generate a workflow from a Python notebook"
            nzTooltipPlacement="bottom"
            type="button">
            <i
              nz-icon
              nzType="robot"
              nzTheme="outline"></i>
          </button>
          <button
            *ngIf="multiWorkflowsOperationButtonEnabled()"
            (click)="toggleSelection()"
            nz-button
            nzType="default"
            [nz-tooltip]="selectionTooltip"
            nzTooltipPlacement="bottom"
            title="Batch Select"
            type="button">
            <i
              nz-icon
              nzType="select"
              nzTheme="outline"></i>
          </button>
          <button
            *ngIf="multiWorkflowsOperationButtonEnabled()"
            (click)="onClickOpenDownloadZip()"
            nz-button
            title="Download added workflow as a ZIP file"
            nz-tooltip="Download added workflow as a ZIP file"
            nzTooltipPlacement="bottom"
            type="button">
            <i
              nz-icon
              nzType="cloud-download"
              nzTheme="outline"></i>
          </button>
          <button
            *ngIf="multiWorkflowsOperationButtonEnabled()"
            (click)="onClickDuplicateSelectedWorkflows()"
            nz-button
            nz-tooltip="Duplicate selected workflows"
            nzTooltipPlacement="bottom"
            type="button">
            <i
              nz-icon
              nzTheme="outline"
              nzType="copy"></i>
          </button>
          <button
            *ngIf="multiWorkflowsOperationButtonEnabled()"
            nz-popconfirm
            nzPopconfirmTitle="Confirm to delete selected workflows."
            nz-button
            nz-tooltip="Delete selected workflows"
            (nzOnConfirm)="handleConfirmDeleteSelectedWorkflows()"
            nzTooltipPlacement="bottom">
            <i
              nz-icon
              nzTheme="outline"
              nzType="delete"></i>
          </button>
        </nz-space-compact>
      </div>
      <div class="create-actions">
        <a
          nz-dropdown
          [nzDropdownMenu]="createWorkflowMenu"
          nzTrigger="click">
          <button
            nz-button
            class="create-btn"
            title="New workflow"
            type="button">
            <i
              nz-icon
              nzType="plus"
              nzTheme="outline"></i>
            <span>New workflow</span>
            <i
              nz-icon
              nzType="down"
              nzTheme="outline"></i>
          </button>
        </a>
        <nz-dropdown-menu #createWorkflowMenu="nzDropdownMenu">
          <ul
            nz-menu
            class="create-workflow-menu">
            <li
              nz-menu-item
              (click)="onClickCreateNewWorkflowFromDashboard()">
              <span class="create-menu-row">
                <i
                  nz-icon
                  nzType="plus"
                  nzTheme="outline"></i>
                From scratch
              </span>
            </li>
            <li
              nz-menu-item
              (click)="onClickCreateWithAgent()">
              <span class="create-menu-row">
                <i
                  nz-icon
                  nzType="robot"
                  nzTheme="outline"></i>
                With agent
              </span>
            </li>
            <li nz-menu-divider></li>
            <li
              nz-menu-item
              (click)="$event.stopPropagation()">
              <nz-upload
                [nzBeforeUpload]="onClickUploadExistingWorkflowFromLocal"
                [nzShowUploadList]="false">
                <span class="create-menu-row">
                  <i
                    nz-icon
                    nzType="cloud-upload"
                    nzTheme="outline"></i>
                  Upload ZIP/JSON
                </span>
              </nz-upload>
            </li>
          </ul>
        </nz-dropdown-menu>
      </div>
    </div>
  </nz-card>

  <ng-template
    #workflowCardTpl
    let-entry>
    <texera-card-item
      class="workflow-card-item"
      [entry]="entry"
      [currentUid]="currentUid"
      [isPrivateSearch]="true"
      [editable]="true"
      (deleted)="deleteWorkflow(entry)"
      (duplicated)="onClickDuplicateWorkflow(entry)"
      (refresh)="refreshSearchResult()"
      (checkboxChanged)="searchResultsComponent.onEntryCheckboxChange()">
    </texera-card-item>
  </ng-template>

  <texera-search-results
    [editable]="true"
    [isPrivateSearch]="true"
    [viewMode]="viewType"
    [cardTemplate]="workflowCardTpl"
    (deleted)="deleteWorkflow($event)"
    (refresh)="refreshSearchResult()"
    (duplicated)="onClickDuplicateWorkflow($event)"
    [currentUid]="currentUid"
    (notifyWorkflow)="updateTooltip()"></texera-search-results>
</div>
