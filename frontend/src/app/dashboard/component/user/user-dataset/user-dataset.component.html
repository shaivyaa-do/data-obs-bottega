<div class="section-container subsection-grid-container">
  <nz-card class="section-title">
    <h2 class="page-title">Datasets</h2>
    <div class="button-group">
      <div class="toolbar-left">
        <div
          class="view-toggle"
          role="group"
          aria-label="View">
          <button
            class="view-toggle-btn"
            title="List View"
            type="button"
            [class.selected]="viewType === 'list'"
            (click)="setViewType('list')">
            <i
              nz-icon
              nzType="bars"
              nzTheme="outline"></i>
          </button>
          <button
            class="view-toggle-btn"
            title="Card View"
            type="button"
            [class.selected]="viewType === 'card'"
            (click)="setViewType('card')">
            <i
              nz-icon
              nzType="appstore"
              nzTheme="outline"></i>
          </button>
        </div>
        <div class="toolbar-search-filter">
          <input
            class="toolbar-search"
            name="dataset-toolbar-search"
            nz-input
            nzVariant="borderless"
            placeholder="Search"
            [ngModel]="searchKeyword"
            (ngModelChange)="onSearchKeywordChange($event)" />
          <texera-filters
            #filters
            class="toolbar-filters"
            [compact]="true"
            [entityType]="entityType"
            [showEditTime]="false"
            [showExecutionTime]="false"
            [sortMethod]="sortMethod"
            (sortMethodChange)="sortMethod = $event; search()"></texera-filters>
        </div>
      </div>
      <div class="create-actions">
        <button
          nz-button
          class="create-btn"
          (click)="onClickOpenDatasetAddComponent()"
          title="Create Dataset">
          <i
            nz-icon
            nzType="plus"
            nzTheme="outline"></i>
          <span>Create Dataset</span>
        </button>
      </div>
    </div>
  </nz-card>

  <ng-template
    #datasetCardTpl
    let-entry>
    <texera-card-item
      [entry]="entry"
      [currentUid]="currentUid"
      [isPrivateSearch]="true"
      [editable]="true"
      (deleted)="deleteDataset(entry)"
      (refresh)="search(true)">
    </texera-card-item>
  </ng-template>

  <texera-search-results
    [editable]="true"
    [isPrivateSearch]="true"
    [viewMode]="viewType"
    [cardTemplate]="datasetCardTpl"
    (deleted)="deleteDataset($event)"
    (refresh)="ngAfterViewInit()"
    [currentUid]="currentUid"></texera-search-results>
</div>
