<nz-card
  class="section-list-container"
  [nzBodyStyle]="{ height: '100%'}">
  <!-- LIST VIEW -->
  <ng-container *ngIf="viewMode === 'list'">
    <div class="list-table-scroll">
      <nz-table
        #resultsTable
        class="results-table"
        [nzData]="tableData"
        [nzFrontPagination]="false"
        [nzShowPagination]="false"
        [nzTableLayout]="'fixed'"
        nzSize="small">
        <thead>
          <tr>
            <th class="name-col">Name</th>
            <th nzWidth="12%">Views</th>
            <th nzWidth="12%">Size</th>
            <th nzWidth="14%">Created</th>
            <th nzWidth="14%">Edited</th>
            <th
              nzWidth="18%"
              class="actions-col">
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let entry of resultsTable.data; trackBy: trackByEntryId"
            texera-list-item
            (deleted)="deleted.emit(entry)"
            (duplicated)="duplicated.emit(entry)"
            (refresh)="refresh.emit()"
            [isPrivateSearch]="isPrivateSearch"
            [editable]="editable"
            [entry]="entry"
            [currentUid]="currentUid"
            (checkboxChanged)="onEntryCheckboxChange()">
          </tr>
        </tbody>
      </nz-table>
      <div class="load-more">
        <button
          nz-button
          *ngIf="!loading && more"
          (click)="loadMore()">
          Load more
        </button>
      </div>
    </div>
  </ng-container>

  <!-- CARD VIEW -->
  <ng-container *ngIf="viewMode === 'card' && cardTemplate">
    <div class="card-scroll-container">
      <div class="card-grid">
        <ng-container
          *ngFor="let entry of entries; trackBy: trackByEntryId"
          [ngTemplateOutlet]="cardTemplate"
          [ngTemplateOutletContext]="{ $implicit: entry }">
        </ng-container>
      </div>
      <div class="load-more">
        <button
          nz-button
          *ngIf="!loading && more"
          (click)="loadMore()">
          Load more
        </button>
      </div>
    </div>
  </ng-container>
</nz-card>
