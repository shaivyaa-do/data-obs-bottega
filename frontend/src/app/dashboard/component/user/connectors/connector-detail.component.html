<div
  class="section-container subsection-grid-container"
  *ngIf="connection">
  <nz-card class="section-title">
    <div class="detail-header">
      <button
        class="go-back-button"
        nz-button
        nzType="text"
        type="button"
        aria-label="Back to connectors"
        nz-tooltip="Back to connectors"
        (click)="back()">
        <i
          nz-icon
          nzType="arrow-left"
          nzTheme="outline"></i>
      </button>
      <h2 class="page-title">{{ connection.name }}</h2>
      <span
        class="status-pill"
        [attr.data-status]="connection.status">
        {{ statusLabel() }}
      </span>
      <div class="detail-actions">
        <button
          nz-button
          type="button"
          (click)="testAgain()">
          <i
            nz-icon
            nzType="reload"
            nzTheme="outline"></i>
          Test again
        </button>
        <button
          nz-button
          nzDanger
          type="button"
          nz-popconfirm
          nzPopconfirmTitle="Delete this connector?"
          (nzOnConfirm)="removeConnector()">
          <i
            nz-icon
            nzType="delete"
            nzTheme="outline"></i>
          Delete
        </button>
        <button
          nz-button
          class="create-btn"
          type="button"
          (click)="openInWorkflow()">
          <i
            nz-icon
            nzType="play-circle"
            nzTheme="outline"></i>
          Use in workflow
        </button>
      </div>
    </div>
  </nz-card>

  <div class="detail-main">
    <section class="detail-section">
      <h3 class="section-heading">Overview</h3>
      <dl class="summary">
        <div>
          <dt>App</dt>
          <dd>{{ typeLabel }}</dd>
        </div>
        <div>
          <dt>Status</dt>
          <dd>{{ statusLabel() }}</dd>
        </div>
        <div>
          <dt>Last tested</dt>
          <dd>{{ lastTested() }}</dd>
        </div>
        <div class="span-2">
          <dt>Destination</dt>
          <dd>{{ destinationSummary(connection) }}</dd>
        </div>
        <div
          class="span-2"
          *ngIf="connection.lastError">
          <dt>Last error</dt>
          <dd>{{ connection.lastError }}</dd>
        </div>
      </dl>
    </section>

    <section class="detail-section">
      <h3 class="section-heading">Credentials</h3>
      <dl class="summary creds">
        <div *ngFor="let row of credentialRows()">
          <dt>{{ row.label }}</dt>
          <dd>{{ row.value }}</dd>
        </div>
      </dl>
    </section>
  </div>
</div>
