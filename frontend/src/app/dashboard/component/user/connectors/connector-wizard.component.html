<div class="wizard-body">
  <div class="modal-header">
    <div class="modal-title-block">
      <h3 id="connect-wizard-title">Connect {{ app.name }}</h3>
      <button
        nz-button
        nzType="link"
        type="button"
        class="change-app-link"
        *ngIf="!existing"
        (click)="backToPicker.emit()">
        Change app
      </button>
    </div>
    <button
      nz-button
      nzType="text"
      type="button"
      class="modal-close-btn"
      aria-label="Close"
      (click)="cancel()">
      <i
        nz-icon
        nzType="close"></i>
    </button>
  </div>

  <nz-steps [nzCurrent]="step">
    <nz-step nzTitle="Credentials"></nz-step>
    <nz-step nzTitle="Test & save"></nz-step>
  </nz-steps>

  <p
    class="hint"
    *ngIf="schemaLoading">
    Loading connection fields…
  </p>
  <p
    class="schema-error"
    *ngIf="schemaError">
    {{ schemaError }}
  </p>

  <section
    class="wizard-step"
    *ngIf="step === 0 && !schemaLoading && !schemaError">
    <div class="credential-form">
      <label class="field field-wide">
        <span>Display name</span>
        <input
          nz-input
          name="displayName"
          [(ngModel)]="displayName"
          placeholder="facilities-prod" />
      </label>
      <label
        class="field"
        [class.field-wide]="field.name !== 'host' && field.name !== 'port'"
        *ngFor="let field of credentialFields">
        <span>{{ fieldLabel(field) }}</span>
        <input
          nz-input
          [name]="field.name"
          [type]="fieldInputType(field)"
          [attr.autocomplete]="field.secret ? 'new-password' : 'off'"
          [(ngModel)]="values[field.name]" />
      </label>
    </div>
  </section>

  <section
    class="wizard-step"
    *ngIf="step === 1">
    <button
      nz-button
      class="create-btn"
      type="button"
      [disabled]="testState === 'testing'"
      (click)="testConnection()">
      {{ testState === "testing" ? "Testing…" : "Test connection" }}
    </button>
    <p
      class="test-message"
      *ngIf="testMessage"
      [class.ok]="testOk"
      [class.err]="!testOk">
      {{ testMessage }}
    </p>
  </section>

  <div class="wizard-actions">
    <button
      nz-button
      type="button"
      (click)="back()">
      Back
    </button>
    <button
      nz-button
      class="create-btn"
      type="button"
      *ngIf="step < 1"
      [disabled]="!canAdvanceFromCredentials"
      (click)="next()">
      Next
    </button>
    <button
      nz-button
      class="create-btn"
      type="button"
      *ngIf="step === 1"
      [disabled]="testState === 'testing'"
      (click)="save()">
      Save connector
    </button>
  </div>
</div>
