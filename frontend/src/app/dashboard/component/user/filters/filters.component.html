<nz-space-compact
  class="filter-button-group"
  ngbDropdown>
  <a
    [hidden]="!isLogin"
    [nzDropdownMenu]="ownerSearchOptions"
    nz-dropdown
    nzTrigger="click"
    class="search-owners-button">
    <button
      id="sortOwner"
      ngbDropdownToggle
      nz-button
      class="filter-btn"
      title="Owner">
      <i
        nz-icon
        nzTheme="outline"
        nzType="user"></i>
      <span>Owner</span>
    </button>
  </a>
  <nz-dropdown-menu #ownerSearchOptions="nzDropdownMenu">
    <ul
      nz-menu
      class="filter-menu-list">
      <li
        nz-menu-item
        *ngFor="let owner of owners">
        <label
          nz-checkbox
          ngDefaultControl
          [(ngModel)]="owner.checked"
          (ngModelChange)="updateSelectedOwners()"
          >{{owner.userName}}</label
        >
      </li>
    </ul>
  </nz-dropdown-menu>

  <a
    *ngIf="this.isLogin && hasIdFilter"
    [nzDropdownMenu]="IDSearchOptions"
    nz-dropdown
    nzTrigger="click"
    class="search-wids-button">
    <button
      id="sortID"
      ngbDropdownToggle
      nz-button
      class="filter-btn"
      title="Workflow ID">
      <i
        nz-icon
        nzTheme="outline"
        nzType="ordered-list"></i>
      <span>ID</span>
    </button>
  </a>
  <nz-dropdown-menu #IDSearchOptions="nzDropdownMenu">
    <ul
      nz-menu
      class="filter-menu-list">
      <li
        nz-menu-item
        *ngFor="let wid of wids">
        <label
          nz-checkbox
          ngDefaultControl
          [(ngModel)]="wid.checked"
          (ngModelChange)="updateSelectedIDs()"
          >{{wid.id}}</label
        >
      </li>
    </ul>
  </nz-dropdown-menu>

  <a
    [nzDropdownMenu]="operatorSearchOptions"
    nz-dropdown
    nzTrigger="click"
    class="search-operators-button">
    <button
      id="sortOperator"
      ngbDropdownToggle
      nz-button
      class="filter-btn"
      title="Operators">
      <i
        nz-icon
        nzType="appstore"
        nzTheme="outline"></i>
      <span>Operators</span>
    </button>
  </a>
  <nz-dropdown-menu #operatorSearchOptions="nzDropdownMenu">
    <ul
      nz-menu
      class="filter-menu-list">
      <li
        nz-submenu
        *ngFor="let group of operatorGroups"
        [nzTitle]="group">
        <ul>
          <li
            nz-menu-item
            *ngFor="let operator of operators.get(group)">
            <label
              nz-checkbox
              ngDefaultControl
              [(ngModel)]="operator.checked"
              (ngModelChange)="updateSelectedOperators()"
              >{{operator.userFriendlyName}}</label
            >
          </li>
        </ul>
      </li>
    </ul>
  </nz-dropdown-menu>
</nz-space-compact>
